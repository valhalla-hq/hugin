name: Check Hugin
on: [push, pull_request]
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python tools/dev.py check --docs
      - run: python tools/dev.py check --group all
      - name: Check Windows ABI without UI or audio
        shell: pwsh
        run: |
          python -m venv --without-pip .runtime/controller
          $env:PYTHONPATH = 'src'
          ./.runtime/controller/Scripts/python.exe -m unittest discover -s tests/windows -p test_windows_abi.py -v
